<body class="bg-background text-on-background h-screen w-full overflow-hidden flex flex-col font-body-md text-body-md antialiased relative">

<!-- Subtle dark overlay to ensure UI legibility -->

</div>
<!-- TopAppBar -->

<button aria-label="Close Camera" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 transition-colors">

<span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">HealthLens</span>
<button aria-label="Settings" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim text-[24px]">settings</span>
</button>
</header>
<!-- Scanning Canvas (Middle) -->
<main class="flex-grow flex items-center justify-center relative z-10">
<!-- Focus Reticle -->

<span class="material-symbols-outlined text-on-surface text-[24px]">photo_library</span>
</button>
<!-- Main Capture Button -->
<button aria-label="Capture Photo" class="relative group w-20 h-20 flex items-center justify-center outline-none" id="captureBtn">
<!-- Outer Ring -->
<div class="absolute inset-0 rounded-full border-4 border-white opacity-80 group-active:scale-95 transition-transform duration-150"></div>
<!-- Inner Fill -->
<div class="w-16 h-16 rounded-full bg-primary-container border-2 border-transparent group-active:scale-90 transition-all duration-150 shadow-lg"></div>
</button>

<button aria-label="Toggle Flash" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-variant/40 backdrop-blur-md border border-white/10 hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-on-surface text-[24px]">flashlight_on</span>
</button>
</div>
</div>
<!-- BottomNavBar (Hidden on this transactional screen as per Semantic Shell Mandate, replaced by custom camera controls above. Kept in code structure to demonstrate understanding of layout but structurally suppressed visually for canvas priority) -->
<!-- 
    <nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-xl pb-lg pt-md bg-surface-variant/30 backdrop-blur-xl dark:bg-surface-container-low/30 border-t border-white/5 rounded-t-xl hidden">
        ... (suppressed)
    </nav>
    -->
<script>
        // Simple micro-interaction for the capture button
        const captureBtn = document.getElementById('captureBtn');
        const reticle = document.getElementById('reticle');

        captureBtn.addEventListener('click', () => {
            // Flash effect
            const flash = document.createElement('div');
            flash.className = 'fixed inset-0 bg-white z-[60] transition-opacity duration-300 pointer-events-none opacity-0';
            document.body.appendChild(flash);
            
            // Trigger reflow
            void flash.offsetWidth;
            
            // Flash on
            flash.classList.remove('opacity-0');
            flash.classList.add('opacity-100');
            
            // Reticle success feedback
            reticle.style.borderColor = '#9ff0fb'; // primary-fixed
            reticle.style.transform = 'scale(1.05)';
            
            setTimeout(() => {
                // Flash off
                flash.classList.remove('opacity-100');
                flash.classList.add('opacity-0');
                
                // Reset reticle
                setTimeout(() => {
                    reticle.style.borderColor = '';
                    reticle.style.transform = 'scale(1)';
                    flash.remove();
                }, 300);
            }, 150);
        });
    </script>

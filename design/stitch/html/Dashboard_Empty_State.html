<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>HealthLens - Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#353534",
                        "primary": "#82d3de",
                        "surface-container-low": "#1c1b1b",
                        "on-error": "#690005",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-container": "#ffd7bd",
                        "surface-container-high": "#2a2a2a",
                        "surface": "#131313",
                        "on-primary-container": "#9becf7",
                        "outline": "#889394",
                        "surface-bright": "#393939",
                        "tertiary-fixed-dim": "#ffb783",
                        "inverse-on-surface": "#313030",
                        "on-surface-variant": "#bec8ca",
                        "primary-container": "#006d77",
                        "on-tertiary-fixed": "#301400",
                        "error-container": "#93000a",
                        "on-secondary-fixed-variant": "#00504b",
                        "on-secondary-fixed": "#00201e",
                        "tertiary": "#ffb783",
                        "inverse-surface": "#e5e2e1",
                        "secondary-container": "#025550",
                        "surface-container-lowest": "#0e0e0e",
                        "surface-container": "#201f1f",
                        "tertiary-fixed": "#ffdcc5",
                        "secondary-fixed": "#acefe7",
                        "error": "#ffb4ab",
                        "primary-fixed-dim": "#82d3de",
                        "surface-dim": "#131313",
                        "primary-fixed": "#9ff0fb",
                        "on-primary": "#00363c",
                        "surface-container-highest": "#353534",
                        "on-surface": "#e5e2e1",
                        "on-background": "#e5e2e1",
                        "secondary": "#90d3cb",
                        "secondary-fixed-dim": "#90d3cb",
                        "background": "#131313",
                        "on-secondary-container": "#86c8c1",
                        "inverse-primary": "#006972",
                        "on-primary-fixed": "#001f23",
                        "on-tertiary-fixed-variant": "#6d390c",
                        "on-primary-fixed-variant": "#004f56",
                        "outline-variant": "#3e494a",
                        "on-tertiary": "#4f2500",
                        "tertiary-container": "#8e5426",
                        "surface-tint": "#82d3de",
                        "on-secondary": "#003734"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "4px",
                        "gutter-mobile": "12px",
                        "stack-lg": "24px",
                        "base": "8px",
                        "stack-md": "16px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.4px", "fontWeight": "700" }],
                        "body-md": ["15px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.2px", "fontWeight": "600" }],
                        "body-lg": ["17px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "label-sm": ["11px", { "lineHeight": "13px", "letterSpacing": "0.5px", "fontWeight": "600" }],
                        "headline-lg": ["34px", { "lineHeight": "41px", "letterSpacing": "-0.4px", "fontWeight": "700" }],
                        "label-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0.1px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: theme('colors.background'); color: theme('colors.on-background'); }
        .glass-card { background: rgba(30, 30, 30, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col pb-32">
<!-- TopAppBar -->
<header class="bg-surface/80 dark:bg-surface/80 backdrop-blur-xl docked full-width top-0 sticky flex justify-between items-center px-margin-mobile h-14 w-full z-50">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container-high overflow-hidden">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A close-up portrait of a professional looking individual smiling warmly. The lighting is soft and natural, emphasizing a modern, approachable clinical aesthetic with a high-contrast dark mode feel." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA1w73UDsjmPzlQPWdcpt7BuF3j1n9rETCWIN27Nx8ltGWClUSLDkNFQ_x3TPyVarRWGth0UGpVyJ0LQDNKfhAPJ2J1S_3vRWSXs3Ni_qXXM9Pxq9KPucZUqm4TRC6yTpD8o1LbrsdkUAeyGdI_P2Inl12ihOM8yLZiCSTamQXAn4XQ_Vspb9lwfSpUJ7J6qxlAZoLQTh8lo2GALnnCO7MFW99_KmHjC03ZT-e4heM1K64AIo_rebHG0cTaO6jTt5gQGmCGR3HaFpcK"/>
</div>
<h1 class="font-headline-md text-headline-md-mobile font-bold text-on-surface dark:text-on-surface">HealthLens</h1>
</div>
<button aria-label="calendar_today" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-variant/20 transition-opacity duration-200 active:opacity-70">
<span class="material-symbols-outlined">calendar_today</span>
</button>
</header>
<main class="flex-1 px-margin-mobile pt-stack-md flex flex-col gap-stack-lg">
<!-- Date Header -->
<section>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Today</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Oct 24, 2023</p>
</section>
<!-- Calories Ring Card -->
<section class="glass-card rounded-xl p-4 flex flex-col items-center justify-center py-8">
<div class="relative w-48 h-48 flex items-center justify-center">
<!-- Background Ring -->
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 100 100">
<circle class="text-surface-container-high" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-width="8"></circle>
</svg>
<!-- Central Data -->
<div class="absolute inset-0 flex flex-col items-center justify-center text-center">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">0</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mt-1">kcal consumed</span>
<div class="h-px w-8 bg-surface-container-high my-2"></div>
<span class="font-body-md text-body-md text-primary">2,000</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Remaining</span>
</div>
</div>
</section>
<!-- Macros Card -->
<section class="glass-card rounded-xl p-4">
<h3 class="font-headline-md text-body-lg mb-4 text-on-surface">Macros</h3>
<div class="flex flex-col gap-4">
<!-- Protein -->
<div>
<div class="flex justify-between items-end mb-1">
<span class="font-label-md text-label-md text-on-surface">Protein</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">0 / 150g</span>
</div>
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary w-0 rounded-full"></div>
</div>
</div>
<!-- Carbs -->
<div>
<div class="flex justify-between items-end mb-1">
<span class="font-label-md text-label-md text-on-surface">Carbs</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">0 / 250g</span>
</div>
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-secondary w-0 rounded-full"></div>
</div>
</div>
<!-- Fat -->
<div>
<div class="flex justify-between items-end mb-1">
<span class="font-label-md text-label-md text-on-surface">Fat</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">0 / 65g</span>
</div>
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-tertiary w-0 rounded-full"></div>
</div>
</div>
</div>
</section>
<!-- Today's Meals Empty State -->
<section class="glass-card rounded-xl p-6 flex flex-col items-center text-center mt-2">
<h3 class="font-headline-md text-body-lg text-on-surface self-start w-full mb-6">Today's Meals</h3>
<div class="w-32 h-32 mb-4 opacity-80">
<img alt="Empty plate illustration" class="w-full h-full object-contain filter brightness-75 drop-shadow-md" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBbTYHhYHgDVwrzdnYUcbDvgoivBTY3jwJKOhdf3ajmB7uy6pZXwqqtLQjk7nqMJtqt9ArJqFNkaazH6OkrvZu2c-V4XLg25VwvK9qsmkHSKG4fkdyJuwGFOCgXn96slEsTjrZmoWwL3gFazuN_MLEGthGXyEG4aIb_-U9_hET9Z4qrOeqR_7aajIIG1x4PuIXer0K_j0LZ6NpUVabFndJ4ZA0CRPQQCMNj8UU0xP2GkClM80nyoqxOLuhwYr3xkKosYD0ax95m5v6C"/>
</div>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[250px]">No meals logged yet. Tap the camera to start tracking.</p>
</section>
</main>
<!-- FAB -->
<button class="fixed bottom-28 left-1/2 transform -translate-x-1/2 w-16 h-16 bg-primary-container text-on-primary-container rounded-full shadow-[0_8px_32px_rgba(0,109,119,0.4)] flex items-center justify-center z-50 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 32px;">photo_camera</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-gutter-mobile pb-safe h-20 border-t border-white/10 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl docked full-width rounded-t-xl">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-variant/10 active:scale-95 transition-transform duration-150 w-full h-full rounded-lg">
<span class="material-symbols-outlined mb-1">folder_open</span>
<span class="font-label-md text-label-md">Library</span>
</button>
<button class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim hover:bg-surface-variant/10 active:scale-95 transition-transform duration-150 w-full h-full rounded-lg">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">dashboard</span>
<span class="font-label-md text-label-md">Dashboard</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-variant/10 active:scale-95 transition-transform duration-150 w-full h-full rounded-lg">
<span class="material-symbols-outlined mb-1">settings</span>
<span class="font-label-md text-label-md">Settings</span>
</button>
</nav>
</body></html>
